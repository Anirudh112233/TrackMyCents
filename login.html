
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyCents- Login</title>
    <link rel="stylesheet" href="styles.css" >
</head>
<body>
    <div class="login-container">
        <section id="login">
            <h2>Sign In</h2>
            <form action="authenticate.php" method="post">
                <fieldset>
                    <legend>Login to your account</legend>
                    
                    <label for="emailid">Email ID:</label>
                    <input type="email" id="emailid" name="emailid" required placeholder="Enter your email address">
            
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
            
                    <input type="submit" value="Login" class="login-btn">
    
                </fieldset>
            </form>
            <p>Don't have an account? <a href="signup.html" class="signup-btn">Sign Up</a></p>
        </section>
    </div>
    <footer>
        <p>&copy; 2024 TrackMyCents. All rights reserved.</p>
    </footer>
</body>
</html>
