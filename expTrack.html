<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyCents - Home</title>
    <link rel="stylesheet" href="expTracker.css"> <!-- Link to external CSS -->
</head>
<body>
    <header>
        <button id="menu-toggle" aria-label="Open menu">
            <span class="menu-icon"></span>
            <span class="menu-icon"></span>
            <span class="menu-icon"></span>
        </button>

        <h1><i>TrackMyCents</i></h1>

        <div class="right-logos" aria-label="Socials">
            <a href="https://github.com/Anirudh112233" class="logo logo1" aria-label="GitHub Profile"></a>
            <a href="https://www.linkedin.com/in/anirudh-mishra-b84363256/" class="logo logo2" aria-label="LinkedIn Profile"></a>
            <a href="https://www.instagram.com/anirudhxmishra/" class="logo logo3" aria-label="Instagram Profile"></a>
        </div>
    </header>
    <div class="sidebar">
        <h3><i>TrackMyCents</i></h3>
        <a href="index.html">🏠 Home</a>
        <a href="#">📅 Budget Planner</a>
        <a href="expTrack.html">💰 Expense Tracking</a>
        <a href="#">✈️ Trip Advisor</a>
        <a href="#">⚙️ Settings</a>
    </div>
    <main>
    <div class ="container">
        <h2>Your balance</h2>
        <h1 id="balance">₹0.00</h1>
        <div class="inc-exp-container">
            <div>
                <h4>Income</h4>
                <p id="money-plus" class="money-plus">
                    +₹0.00
                </p>
            </div>
            <div>
                <h4>Expense</h4>
                <p id="money-minus" class="money-minus">
                    -₹0.00
                </p>
            </div>
        </div>
        <h3>History</h3>
        <ul id="list" class="list" >
            <li class="minus">
                Cash <span>-₹400</span><button class="delete-btn">x</button>
            </li>
        </ul>
        <h3>Add New Transaction</h3>
        <form id ="form">
            <div class="form-control">
                <label for="Text">Text</label>
                <input type="text" id="text" placeholder="Enter Text.....">
            </div>
            <div class="form-control">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter Amount.....">
            </div>
            <button class="btn">Add Transactions</button>
        </form>
    </div>

    <script src="script.js"></script> <!-- Link to external JavaScript -->
</body>
</html>
