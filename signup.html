<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyCents - Sign Up</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to external CSS -->
</head>
<body>
    <header>
        <h1>TrackMyCents</h1>
    </header>

    <div class="signup-container">
        <section id="signup">
            <h2>Sign Up</h2>
            <form action="authenticate.php" method="post">
                <fieldset>
                    <legend>Create a New Account</legend>
                    
                    <!-- Name -->
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">

                    <!-- Username -->
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required placeholder="Choose a unique username">

                    <!-- Email -->
                    <label for="emailid">Email ID:</label>
                    <input type="email" id="emailid" name="emailid" required placeholder="Enter your email address">

                    <!-- Contact Number -->
                    <label for="contactno">Contact Number:</label>
                    <input type="tel" id="contactno" name="contactno" required placeholder="Enter your contact number" 
                           pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number">

                    <!-- New Password -->
                    <label for="newpassword">New Password:</label>
                    <input type="password" id="newpassword" name="newpassword" required placeholder="Create a password">

                    <!-- Confirm Password -->
                    <label for="confirmpassword">Confirm Password:</label>
                    <input type="password" id="confirmpassword" name="confirmpassword" required placeholder="Re-enter your password">

                    <!-- Submit Button -->
                    <input type="submit" value="Sign Up" class="signup-btn">
                </fieldset>
            </form>
            
            <!-- Link to Login -->
            <p>Have an account? <a href="login.html" class="login-btn">Login</a></p>
        </section>
    </div>

    <footer>
        <p>&copy; 2024 TrackMyCents. All rights reserved.</p>
    </footer>
</body>
</html>
