<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyCents - Home</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to external CSS -->
</head>
<body>
    <header>
        <button id="menu-toggle" aria-label="Open menu">
            <span class="menu-icon"></span>
            <span class="menu-icon"></span>
            <span class="menu-icon"></span>
        </button>
        <h1>TrackMyCents</h1>
        <button id="login-toggle">Login</button>
    </header>
    <section id="home"></section>
    <main>
        <h2>Welcome to TrackMyCents</h2>
    <div class ="container">
        <h4>Your balance</h4>
        <h1 id="balance">₹0.00</h1>
        <div class="inc-exp-container">
            <div>
                <h4>Income</h4>
                <p id="money-plus" class="money-plus">
                    +₹0.00
                </p>
            </div>
            <div>
                <h4>Expense</h4>
                <p id="money-minus" class="money-minus">
                    -₹0.00
                </p>
            </div>
        </div>
        <h3>History</h3>
        <ul id="list" class="list" >
            <li class="minus">
                Cash <span>-₹400</span><button class="delete-btn">x</button>
            </li>
        </ul>
        <h3>Add New Transaction</h3>
        <form id ="form">
            <div class="form-control">
                <label for="Text">Text</label>
                <input type="text" id="text" placeholder="Enter Text.....">
            </div>
            <div class="form-control">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter Amount.....">
            </div>
            <button class="btn">Add Transactions</button>
        </form>
    </div>
    


    <div id="side-menu" class="side-menu">
        <button id="close-menu" aria-label="Close menu">&times;</button>
        <h2>Menu</h2>
        <ul>
            <li><a href="login.html">Login</a></li>
            <li><a href="features.html">Features</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>   
    </div>

    <script src="script.js"></script> <!-- Link to external JavaScript -->
</body>
</html>
